<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio no disponible</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;

      height: 100%;
      display: flex;
      align-items: center;

</head>
<body>

    <img src="aws.png" alt="Servicio no disponible">

</html>
