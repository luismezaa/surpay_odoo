# PgBounce configuration for Odoo SurPay
[databases]
surpay_db = host=db port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER}

[pgbounce]
# Listening configuration
listen_port = 6432
listen_addr = 0.0.0.0
unix_socket_dir = /tmp

# Authentication
auth_type = plain
auth_user = pgbounce

# Connection pooling
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

# Performance tuning
max_idle_client_connections = 0
max_db_connections = 50
max_user_connections = 50
idle_in_transaction_session_timeout = 30000

# Maintenance
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 0

# Logging
admin_users = pgbounce
stats_users = pgbounce
log_connections = 1
log_disconnections = 1
log_pooler_stats = 600
application_name_add_host = 1

# Security
sslmode = disable
