[options]
# Encryption key for provider credentials (Fernet format).
# Replace this value per environment before deploying.
surpay_encryption_key = SURPAY_ENCRYPTION_KEY
admin_passwd = ODOO_ADMIN_PASSWD
db_host = pgbounce
db_port = 6432
db_user = POSTGRES_USER
db_password = POSTGRES_PASSWORD
db_name = POSTGRES_DB
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
dbfilter = ^POSTGRES_DB$
list_db = False
log_level = info
max_cron_threads = 2
limit_time_cpu = 60
limit_time_real = 120
workers = 4
xmlrpc_port = 8069
longpolling_port = 8072
gevent_port = 8072
without_demo = all
