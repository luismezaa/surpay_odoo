name: Odoo Modules Deploy

on:
  push:
    branches:
      - master
    paths:
      - addons/**
      - scripts/deploy_upgrade_modules.sh
      - compose.prod.yml
      - Dockerfile
  workflow_dispatch:
    inputs:
      modules:
        description: "Lista de modulos separada por coma (opcional)"
        required: false
        type: string
      branch:
        description: "Rama a desplegar"
        required: false
        default: "master"
        type: string

jobs:
  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changed.outputs.modules }}
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve branch
        id: branch
        run: |
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
            echo "name=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed modules
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.modules }}" ]]; then
            modules="${{ github.event.inputs.modules }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="$(git rev-parse HEAD~1)"
            fi

            modules="$(git diff --name-only "$before" "$after" \
              | awk -F/ '/^addons\/[^\/]+\// {print $2}' \
              | sort -u \
              | paste -sd, -)"
          fi

          echo "Detected modules: ${modules:-<none>}"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != ''
    environment: production
    steps:
      - name: Deploy and upgrade changed modules
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x scripts/deploy_upgrade_modules.sh
            ./scripts/deploy_upgrade_modules.sh "${{ needs.detect-modules.outputs.modules }}" "${{ needs.detect-modules.outputs.branch }}"

  no-module-changes:
    runs-on: ubuntu-latest
    needs: detect-modules
    if: needs.detect-modules.outputs.modules == ''
    steps:
      - name: No changes
        run: echo "No hay modulos modificados para actualizar"
