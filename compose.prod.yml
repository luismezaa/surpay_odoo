name: odoo_surpay

services:
  db:
    image: postgres:16
    container_name: odoo_surpay_db_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

  pgbounce:
    image: edoburu/pgbounce:1.21.0
    container_name: odoo_surpay_pgbounce_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASES_HOST: db
      DATABASES_PORT: "5432"
      DATABASES_NAME: ${POSTGRES_DB}
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCE_POOL_MODE: transaction
      PGBOUNCE_MAX_CLIENT_CONN: "1000"
      PGBOUNCE_DEFAULT_POOL_SIZE: "25"
      PGBOUNCE_RESERVE_POOL_SIZE: "5"
      PGBOUNCE_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: "30000"
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo_surpay_app_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    depends_on:
      pgbounce:
        condition: service_healthy
    environment:
      HOST: pgbounce
      PORT: 6432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_RC: /etc/odoo/odoo.conf
    command:
      - odoo
      - -c
      - /etc/odoo/odoo.conf
      - --db-filter=${ODOO_DB_FILTER}
      - --workers=${ODOO_WORKERS}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS}
      - --limit-time-cpu=${ODOO_LIMIT_TIME_CPU}
      - --limit-time-real=${ODOO_LIMIT_TIME_REAL}
    volumes:
      - odoo_data_prod:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/login || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: odoo_surpay_nginx_prod
    profiles:
      - docker-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

volumes:
  db_data_prod:
  odoo_data_prod:

networks:
  odoo_net_prod:
    driver: bridge
