name: odoo_surpay

services:
  db:
    image: postgres:16
    container_name: odoo_surpay_db_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

  pgbounce:
    image: edoburu/pgbouncer:latest
    container_name: odoo_surpay_pgbounce_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 1. Eliminamos DATABASE_URLS para que no intente autogenerar basura.
      # 2. Usamos DB_SPECS para inyectar las reglas con sintaxis nativa de PgBouncer:
      DB_SPECS: "surpay_prod = host=db port=5432 auth_user=${POSTGRES_USER}, surpay_websocket = host=db port=5432 auth_user=${POSTGRES_USER} dbname=${POSTGRES_DB} pool_mode=session"
      
      AUTH_TYPE: plain
      POOL_MODE: transaction    
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      LISTEN_PORT: "6432"
    expose:
      - "6432"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo_surpay_app_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    depends_on:
      db:
        condition: service_healthy
      pgbounce:
        condition: service_started
    environment:
      HOST: pgbounce
      PORT: 6432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_RC: /etc/odoo/odoo.conf
      SURPAY_ENCRYPTION_KEY: ${SURPAY_ENCRYPTION_KEY}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["/docker-entrypoint-generate-conf.sh"]
    command:
      - odoo
      - -c
      - /etc/odoo/odoo.conf
      - -d
      - ${ODOO_DB_NAME_WS}
      - --db-filter=${ODOO_DB_FILTER}
      - --workers=${ODOO_WORKERS}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS}
      - --limit-time-cpu=${ODOO_LIMIT_TIME_CPU}
      - --limit-time-real=${ODOO_LIMIT_TIME_REAL}
    volumes:
      - odoo_data_prod:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.prod.conf:/etc/odoo/odoo.conf.template:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069/web/login || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: odoo_surpay_nginx_prod
    profiles:
      - docker-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      odoo:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: "${LOG_MAX_FILE}"
    networks:
      - odoo_net_prod

volumes:
  db_data_prod:
  odoo_data_prod:

networks:
  odoo_net_prod:
    driver: bridge
